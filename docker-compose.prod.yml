# 운영: EC2 1대에서 API + 프론트(nginx 정적 서빙)를 컨테이너 2개로 같이 띄운다 (팀 결정 — 파일럿 규모, 별도 프론트 호스팅 없음).
#   준비:  cp .env.prod.example .env.prod  → 값 채우기 (커밋 금지, .gitignore 등록)
#          mkdir -p data/db data/uploads/menu data/uploads/event && sudo chown -R 10001:10001 data
#   기동:  docker compose -f docker-compose.prod.yml up -d --build
#   로그:  docker compose -f docker-compose.prod.yml logs -f api
#   백업:  DB 파일은 ./data/db 호스트 폴더 — EC2가 죽으면 같이 사라진다. 필요하면 tar czf로 수동 백업
# API는 프론트 컨테이너가 도커 내부망으로만 중계한다(frontend/nginx.conf의 /api·/uploads proxy_pass) —
#   그래서 CORS 설정이 필요 없고 8080도 퍼블릭에 열 필요가 없다.
# HTTPS: 호스트의 /etc/letsencrypt(certbot 발급 인증서, booothlook.com)를 프론트 컨테이너에 읽기전용으로
#   마운트해서 nginx가 443에서 직접 TLS 종료한다. 인증서 갱신(certbot renew) 시 이 컨테이너를 재시작해야
#   새 인증서가 반영된다 — /etc/letsencrypt/renewal/booothlook.com.conf의 post_hook 참조.
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: boothlock-server:latest
    container_name: boothlock-api
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      # 호스트 루프백에만 노출 — EC2 안에서 curl로 진단할 때만 쓴다. 실제 트래픽은 frontend 컨테이너가
      # 도커 내부망(서비스명 api)으로 중계하므로 이 포트를 퍼블릭에 열 필요가 없다
      - "127.0.0.1:8080:8080"
    volumes:
      # H2 DB 파일 — 컨테이너를 내렸다 올려도(재배포) 그대로 남는다. EC2가 죽으면 이것도 같이 사라진다(팀 결정)
      - ./data/db:/app/data/db
      # 메뉴 사진·행사 약도 — 서버 로컬 폴더. 컨테이너 UID 10001이 쓸 수 있어야 한다
      - ./data/uploads:/app/data/uploads
      # 시딩 JSON(계정 정보 포함) — 읽기 전용. BOOTLOCK_SEED_FILE=/app/seed/event-seed.json
      - ./seed:/app/seed:ro
    # 헬스체크는 Dockerfile의 것을 쓴다 (GET /api/v1/event/booths)
    deploy:
      resources:
        limits:
          # t3.small(2GiB) 기준. JVM은 JAVA_TOOL_OPTIONS의 MaxRAMPercentage=70으로 이 한도 안에서 힙을 잡는다
          memory: 1200m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # VITE_API_BASE_URL을 안 넘긴다 — 비워두면 프론트가 상대경로(/api/...)로 호출하고, nginx가 같은
      # 오리진에서 받아 api 컨테이너로 중계한다(내부망). 그래서 EC2 주소가 바뀌어도 프론트를 다시 빌드할 필요가 없다
      args:
        # Vite는 빌드 시점에 값을 코드에 박아 넣는다 — 바꾸면 반드시 --build 로 다시 빌드해야 반영된다.
        # .env.prod에 VITE_SIGNUP_ENABLED=true 를 넣고 docker compose up -d --build (백엔드는 BOOTLOCK_SIGNUP_ENABLED로 따로 켠다)
        VITE_SIGNUP_ENABLED: "${VITE_SIGNUP_ENABLED:-false}"
    image: boothlock-frontend:latest
    container_name: boothlock-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Let's Encrypt 인증서 — 심볼릭 링크(live/ → archive/)까지 그대로 유지되도록 디렉토리 전체를 마운트
      - /etc/letsencrypt:/etc/letsencrypt:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
