# DB만 RDS로 옮기는 오버레이. 프론트·TLS·도메인은 그대로 둔다 (certbot 인증서, EC2 nginx가 443).
# 이 파일을 -f 로 얹을 때만 RDS를 쓴다 — 평소 배포는 docker-compose.prod.yml 하나로 H2를 쓴다.
#
# 쓰는 법: 기존 파일을 덮어쓰지 않고 오버레이로 얹는다 —
#     docker compose -f docker-compose.prod.yml -f docker-compose.rds.yml up -d
# 되돌리기: -f docker-compose.rds.yml 만 빼고 같은 명령을 다시 돌린다. 30초면 H2로 돌아온다.
#     (단 .env.prod에서 SPRING_DATASOURCE_* 세 줄을 반드시 지울 것 — OS 환경변수가 우선이라
#      프로필을 prod로 되돌려도 남아 있으면 계속 RDS로 붙는다)
#
# docker compose는 두 파일을 병합한다. 여기 적은 키만 덮어써지고, 나머지(빌드 컨텍스트·헬스체크·
# 메모리 한도·로깅·frontend 서비스 전체)는 docker-compose.prod.yml 것이 그대로 쓰인다.
#
# ./data/db 볼륨은 병합 규칙상 여기서 뺄 수 없어 그대로 마운트된 채 남는다 — RDS로 붙으면 그 폴더를
# 아무도 쓰지 않으니 무해하고, 오히려 롤백할 때 옛 H2 파일이 그 자리에 있어서 편하다.
services:
  api:
    environment:
      # prod(H2) 위에 rds 오버레이를 얹는다. 순서가 중요하다 — 뒤에 적은 rds가 데이터소스 키를 덮어쓴다.
      # application-rds.properties는 backend/src/main/resources/ 에 있다
      SPRING_PROFILES_ACTIVE: prod,rds
      # 값은 .env.prod에서 온다. 여기에 직접 적지 않는다 — 이 파일은 커밋되고 비밀번호는 커밋하면 안 된다
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    # RDS가 EC2와 같은 VPC의 프라이빗 서브넷에 있고 보안 그룹이 EC2 보안 그룹에서만 3306을 받도록
    # 열려 있어야 한다 (퍼블릭 액세스 없음). 기동 실패 시 EC2에서 먼저 확인:
    #     nc -vz <RDS 엔드포인트> 3306
    # "Connection refused"면 보안 그룹, "timeout"이면 서브넷·라우팅 문제다.
