spring.application.name=boothlock-server
spring.datasource.url=jdbc:h2:file:./data/boothlock;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# 업로드 상한 — 명세서 O9 (사진 최대 5MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# JWT 서명 키. 아래 기본값은 로컬 개발 전용이며 저장소에 공개돼 있어 안전하지 않다.
# 운영에서는 반드시 BOOTLOCK_JWT_SECRET 환경 변수로 덮어쓸 것 —
# 덮어쓰지 않으면 기동 시 경고 로그가 뜬다 (BoothJwtProvider).
boothlock.jwt.secret=${BOOTLOCK_JWT_SECRET:dev-only-insecure-secret-do-not-use-in-production}

# 고객용 프론트 도메인 — 실제 배포 도메인 확정 전 임시값 (O4 QR 생성용).
# QR은 {base-url}/t/{tableToken}을 인코딩하고, 같은 도메인 문구를 이미지에 병기해 위조 QR을 가려낸다.
# 도메인 확정 시 BOOTLOCK_CUSTOMER_BASE_URL 환경 변수로 덮어쓸 것.
boothlock.customer.base-url=${BOOTLOCK_CUSTOMER_BASE_URL:https://boothlock.app}
