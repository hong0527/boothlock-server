spring.application.name=boothlock-server
spring.datasource.url=jdbc:h2:file:./data/boothlock;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# 업로드 상한 — 명세서 O9 (사진 최대 5MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# 운영 환경에서는 반드시 환경 변수로 주입한다. 실제 키는 저장소에 두지 않는다.
boothlock.jwt.secret=${BOOTLOCK_JWT_SECRET:}
