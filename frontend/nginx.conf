# SPA(React Router) — /t/{tableToken} 같은 경로를 새로고침해도 index.html로 넘겨서 클라이언트 라우터가 처리하게 한다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 메뉴 사진 업로드 상한(5MB)보다 커야 한다 — nginx 기본(1MB)이면 API까지 가기 전에 413으로 막힌다
    client_max_body_size 6m;

    # API를 외부에 직접 노출하지 않고 이 안에서만 중계한다(도커 내부망, 서비스명 api로 접속) —
    # 그러면 프론트·API가 브라우저 기준 같은 오리진이 되어 CORS 설정 자체가 필요 없어지고,
    # api 컨테이너는 8080을 퍼블릭에 열 필요가 없다(docker-compose.prod.yml 참조)
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://api:8080/uploads/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산은 파일명에 해시가 붙으므로(Vite 빌드) 오래 캐시해도 안전하다
    location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
