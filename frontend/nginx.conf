# SPA(React Router) — /t/{tableToken} 같은 경로를 새로고침해도 index.html로 넘겨서 클라이언트 라우터가 처리하게 한다.
# HTTPS: Let's Encrypt 인증서(EC2 호스트의 /etc/letsencrypt를 컨테이너에 read-only 마운트, docker-compose.prod.yml 참조).
# 갱신은 certbot renew가 인증서 파일만 갱신하고, 갱신 시 pre/post hook으로 이 컨테이너를 재시작해 새 인증서를 반영한다.

server {
    listen 80;
    server_name _;
    # ACME HTTP-01 갱신 시 certbot이 standalone으로 잠깐 이 포트를 점유하므로,
    # 평소에는 80으로 들어오는 요청을 전부 443으로 리다이렉트만 한다.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    # HTTP/2 — 연결 하나로 js·css·API를 동시에 받아, 축제장처럼 왕복 지연이 큰 망에서 첫 화면·폴링이 덜 밀린다
    http2 on;
    server_name booothlook.com www.booothlook.com;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/booothlook.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/booothlook.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 텍스트 압축 — 번들 js(수백 KB)·API JSON이 1/3~1/4로 준다. 이미지(jpg·png·webp)는 이미 압축돼 있어 대상에서 뺀다
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # api 주소를 요청 때마다 도커 내장 DNS(127.0.0.11)로 다시 찾는다. proxy_pass에 호스트명을 그대로 쓰면
    # nginx가 기동할 때 한 번만 해석해서 (1) api만 재배포돼 IP가 바뀌면 frontend를 재시작할 때까지 전부 502,
    # (2) api가 내려가 있는 동안 frontend가 재시작되면(인증서 갱신 hook 등) "host not found"로 nginx가 아예 안 떠
    # 사이트 전체가 죽는다. 변수로 넘기면 둘 다 막힌다 — 변수 proxy_pass는 URI를 붙이지 않고 원래 요청 경로를 그대로 넘긴다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    # 메뉴 사진 업로드 상한(5MB)보다 커야 한다 — nginx 기본(1MB)이면 API까지 가기 전에 413으로 막힌다
    client_max_body_size 6m;

    # API를 외부에 직접 노출하지 않고 이 안에서만 중계한다(도커 내부망, 서비스명 api로 접속) —
    # 그러면 프론트·API가 브라우저 기준 같은 오리진이 되어 CORS 설정 자체가 필요 없어지고,
    # api 컨테이너는 8080을 퍼블릭에 열 필요가 없다(docker-compose.prod.yml 참조)
    # ^~ 로 프리픽스 매치를 즉시 확정한다 — 없으면 아래 정규식 location(이미지 확장자)이 우선순위가
    # 더 높아서 /uploads/menu/xxx.jpg 같은 요청을 정적 파일로 잘못 가로채 404를 낸다(실측)
    location ^~ /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html은 매번 새로 확인하게 한다 — 브라우저가 옛 index.html을 캐시하면 영업 중 재배포 뒤
    # 이미 지워진 옛 해시 js를 불러 화면이 하얗게 된다. 해시가 붙은 js·css는 아래에서 오래 캐시한다
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # 정적 자산은 파일명에 해시가 붙으므로(Vite 빌드) 오래 캐시해도 안전하다
    location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
