# 테스트는 파일 DB 대신 메모리 DB — 서버(bootRun)를 켠 채 ./gradlew build를 돌려도 파일 잠금 충돌이 없다
spring.datasource.url=jdbc:h2:mem:test;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
boothlock.jwt.secret=test-only-jwt-secret-at-least-32-bytes
boothlock.customer.base-url=https://boothlock.test
# 회원가입 관련 테스트(BoothSignupApiTests)가 기본값(꺼짐)이 아니라 켜진 상태를 가정하므로 여기서 켠다.
#   꺼진 상태의 403 동작은 BoothSignupDisabledApiTests가 @SpringBootTest(properties=...)로 따로 덮어써 확인한다.
boothlock.signup.enabled=true
