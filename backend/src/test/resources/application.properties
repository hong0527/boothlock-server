# 테스트는 파일 DB 대신 메모리 DB — 서버(bootRun)를 켠 채 ./gradlew build를 돌려도 파일 잠금 충돌이 없다
spring.datasource.url=jdbc:h2:mem:test;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
boothlock.jwt.secret=test-only-jwt-secret-at-least-32-bytes
boothlock.customer.base-url=https://boothlock.test
# boothlock.signup.enabled는 일부러 두지 않는다 — 여기서 켜면 모든 테스트 컨텍스트가 운영 기본값(꺼짐)과
#   다른 설정으로 돌아 "기본은 꺼짐"을 확인하는 테스트가 엉뚱한 이유로 통과할 수 있다.
#   기능이 필요한 BoothSignupApiTests가 @SpringBootTest(properties=...)로 자기 컨텍스트에서만 켠다.
