spring.application.name=boothlock-server
spring.datasource.url=jdbc:h2:file:./data/boothlock;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# 업로드 상한 — 명세서 O9 (사진 최대 5MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# JWT 서명 키. 아래 기본값은 로컬 개발 전용이며 저장소에 공개돼 있어 안전하지 않다.
# 운영에서는 반드시 BOOTLOCK_JWT_SECRET 환경 변수로 덮어쓸 것 —
# 덮어쓰지 않으면 기동 시 경고 로그가 뜬다 (BoothJwtProvider).
boothlock.jwt.secret=${BOOTLOCK_JWT_SECRET:dev-only-insecure-secret-do-not-use-in-production}

# 고객용 프론트 도메인 — 실제 배포 도메인 확정 전 임시값 (O4 QR 생성용).
# QR은 {base-url}/t/{tableToken}을 인코딩하고, 같은 도메인 문구를 이미지에 병기해 위조 QR을 가려낸다.
# 도메인 확정 시 BOOTLOCK_CUSTOMER_BASE_URL 환경 변수로 덮어쓸 것.
boothlock.customer.base-url=${BOOTLOCK_CUSTOMER_BASE_URL:https://boothlock.app}

# 손님 홈 화면(명세서 E1·E2) 설정.
#
# seat-idle-minutes: 이 시간 동안 주문·조회가 없으면 그 테이블을 빈자리로 센다 (SeatIdlePolicy).
#   같은 기준을 손님 홈 화면(E1)·운영자 좌석 현황(O3 session/needsCleanup)·QR 재스캔(C1: 유휴 세션은 복원 대신 종료 후 새 발급)이 함께 쓴다.
#   단, 현재 영업일(06:00 경계)의 미결제 주문이 있는 세션은 유휴여도 활성으로 본다(명세 §7-9).
#   짧게 잡으면 아직 있는 손님 자리가 빈자리로 보이고, 길게 잡으면 떠난 자리가 계속 만석으로 잡힌다.
#   코드를 다시 빌드하지 않고 이 값이나 환경변수 BOOTHLOCK_EVENT_SEATIDLEMINUTES를 바꾼 뒤 재시작하면 반영된다.
#   0 이하는 기동 시 거부된다.
boothlock.event.seat-idle-minutes=180

# booths-cache-seconds: 부스 목록·좌석 현황(E1) 결과를 이 시간 동안 재사용한다 (명세 §E1·§7-19, 0이면 끔).
#   인증 없는 폴링 API라 캐시가 없으면 반복 호출이 좌석 집계 쿼리를 계속 돌려 주문 API와 DB 연결을 다툰다.
#   대가로 좌석 수와 주문 접수 여부가 최대 이 시간만큼 늦게 보인다.
boothlock.event.booths-cache-seconds=10

# event-dir: 행사장 약도 이미지 저장 위치. 메뉴 사진(boothlock.upload.menu-dir)과 폴더를 분리해 둔다.
#   /uploads/event/** 로 인증 없이 서빙된다. 마지막 폴더 이름은 event여야 하고, 작업 디렉터리나 그 상위,
#   파일 DB가 들어 있는 폴더를 가리키면 기동이 거부된다(잘못 두면 DB 파일이 그대로 내려받아진다).
#   png·jpg·jpeg·webp만 서빙하며 nosniff와 스크립트 차단 CSP 헤더가 붙는다.
boothlock.upload.event-dir=data/uploads/event

# CORS 허용 오리진 (프론트와 API 도메인 분리 배포용). 쉼표로 여러 개, 형식은 scheme://host[:port] (경로·끝 슬래시 없이).
#   기본값은 로컬 Vite 개발 서버만이다. 운영에서는 BOOTLOCK_CORS_ALLOWED_ORIGINS 환경 변수에 프론트 배포 도메인을 넣을 것
#   (예: https://boothlock.app,https://www.boothlock.app). 대상 경로는 /api/** 와 /uploads/** 이며 쿠키는 쓰지 않는다(allowCredentials=false).
#   `*`는 기동 시 거부된다 — 운영자 API가 모든 사이트에 열린다. 프론트를 같은 도메인에서 서빙하면 빈 값으로 두어 CORS를 끈다.
boothlock.cors.allowed-origins=${BOOTLOCK_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# 행사 시딩(명세 §5) — 켠 기동에서만 부스·부스별 ADMIN 계정·약도를 넣는다. 기본은 꺼짐.
#   두 번 켜도 중복으로 넣지 않고 이미 있는 부스·계정은 고치지 않지만, 시딩이 끝나면 다시 끄는 것을 권장한다.
#   시딩 파일은 저장소 밖에 둔다(형식 예시: classpath seed/event-seed.example.json).
#   비밀번호는 파일에 적지 말고 passwordEnv로 OS 환경변수에서 읽는다. 명령행 인자(--X=비번)는 ps에 보이므로 쓰지 않는다.
#   약도 이미지는 boothlock.upload.event-dir 안에 미리 둬야 한다 — 없으면 기동이 실패한다.
#   정확히 true일 때만 켜진다(오타는 꺼짐으로 처리된다).
boothlock.seed.enabled=${BOOTLOCK_SEED_ENABLED:false}
boothlock.seed.file=${BOOTLOCK_SEED_FILE:}
