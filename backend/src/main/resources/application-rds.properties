# =====================================================================================
# RDS MySQL 오버레이 프로필
#
# 이 파일이 있다고 RDS를 쓰는 게 아니다 — rds 프로필을 켤 때만 읽힌다. 기본은 H2 그대로다.
# 켜는 법:   .env.prod에 SPRING_PROFILES_ACTIVE=prod,rds + SPRING_DATASOURCE_* 세 줄 (.env.prod.example 참고)
# 끄는 법:   그 네 줄을 주석 처리하고 같은 명령으로 재배포
#   재배포 명령은 어느 쪽이든 같다: docker compose -f docker-compose.prod.yml up -d --build
#
# 왜 application-prod.properties를 고치지 않고 파일을 따로 두는가:
#   Spring Boot는 SPRING_PROFILES_ACTIVE에 적힌 순서대로 프로필 파일을 읽고, 뒤에 적힌 프로필이
#   앞의 값을 덮어쓴다. prod,rds 로 켜면 application-prod.properties(H2)를 먼저 읽고 이 파일이
#   데이터소스 관련 키만 덮어쓴다. 그래서 H2 구성은 원본 그대로 살아 있다.
#
# 반만 켜진 상태는 기동 단계에서 막는다:
#   rds 프로필인데 주소가 비었거나 MySQL이 아님 → RdsDatasourceGuard
#   주소는 MySQL인데 rds 프로필이 없음            → ProdH2DatasourceGuard (2026-09-22 실제 사고)
# =====================================================================================

# 실측(2026-09-21, MySQL 8.0 컨테이너):
#   prod,rds 로 기동 → 프로필 2개 활성, MySQL URL 사용, validate 통과, 무인증 API 200.
#   앱 커넥션 격리수준 READ-COMMITTED 확인 (서버 기본값은 REPEATABLE-READ 그대로) — 이 파일이 실제로 먹는다.
#   booth.depositor_name 을 일부러 지우니 "missing column [depositor_name] in table [booth]" 로
#   기동이 멈췄다. validate 가 스키마 어긋남을 실제로 잡는다.

# --- 데이터소스: RDS MySQL 8.0 ---
# URL을 파일에 박지 않는다 — 엔드포인트는 RDS를 다시 만들면 바뀌고, 비밀번호는 환경변수여야 한다.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 권장 URL 쿼리스트링 (docker-compose.local-mysql.yml에서 실제로 쓴 것과 같다):
#   ?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci
# serverTimezone: DATETIME은 타임존을 저장하지 않는다. JVM(TZ=Asia/Seoul)·JDBC·DB 셋을 KST로 맞춰야
#   영업일 06:00 경계가 어긋나지 않는다 (DB스키마 원칙 8).
# connectTimeout·socketTimeout은 URL에 넣지 않는다 — 아래 data-source-properties로 이 파일이 건다.

# 풀 크기 — RDS db.t4g.micro의 max_connections는 약 80이다. 앱 1대 × 10이면 충분하고, 수동 접속
# 여유도 남는다. EC2를 2대로 늘릴 계획이 생기면 그때 다시 본다.
spring.datasource.hikari.pool-name=boothlock
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000
# 커넥션이 오래 놀면 RDS·NAT가 끊는다. MySQL wait_timeout(기본 28800초)보다 짧게 재활용한다
spring.datasource.hikari.max-lifetime=1740000
spring.datasource.hikari.idle-timeout=600000

# --- 드라이버 네트워크 타임아웃 (MySQL Connector/J 속성, 단위 ms) ---
# 기본값은 둘 다 0(무한)이다. RDS 장애 조치·네트워크 단절처럼 응답 없이 끊긴 소켓에서는 요청 스레드가
# 영원히 읽기 대기에 묶이고, 풀 10개가 다 묶이면 모든 API가 connection-timeout(10초) 뒤 500이 된다 — 재기동 전까지.
#   connectTimeout=5000  : TCP 연결 수립 대기. 같은 VPC의 RDS는 수 ms라 5초면 "안 붙는다"가 확실하다
#   socketTimeout=30000  : 쿼리 응답(소켓 읽기) 대기. 정상 쿼리는 이보다 훨씬 짧아(부하시험 4부스×35테이블 통과) 넉넉하다.
#     단 InnoDB 행 잠금 대기(innodb_lock_wait_timeout 기본 50초)보다 짧아서, 잠금을 30초 넘게 기다리면
#     "잠금 대기 초과" 대신 소켓 타임아웃으로 커넥션이 끊긴다(요청은 500, 트랜잭션은 롤백). 행사 규모에서 30초 잠금은
#     이미 장애라 그쪽이 낫다고 본다 — 파라미터 그룹에서 innodb_lock_wait_timeout을 30 아래로 낮추면 메시지가 깔끔해진다.
# URL(SPRING_DATASOURCE_URL)이 아니라 여기 두는 이유: 운영 .env.prod를 고치지 않고 이 파일 배포만으로 적용되게 하려고.
# Hikari는 jdbcUrl 방식에서도 data-source-properties를 드라이버 connect(url, props)에 그대로 넘긴다.
# URL 쿼리스트링에 같은 키를 또 적지 말 것 — 두 곳의 값이 다르면 어느 쪽이 이기는지 헷갈린다.
spring.datasource.hikari.data-source-properties.connectTimeout=5000
spring.datasource.hikari.data-source-properties.socketTimeout=30000

# --- 격리수준: 절대 지우지 말 것 ---
# prod 프로필에도 같은 줄이 있지만, "이 값이 MySQL에서 무엇을 막는지"가 여기서 훨씬 중요해서 다시 적는다.
# InnoDB 기본값인 REPEATABLE READ로 두면 전체 테스트 629건 중 동시성 5건이 실제로 실패했다
# (배포_운영절차.md §3-4, 로컬 mysqld 8.4.0 실측). 가장 위험한 것은 두 운영자가 서로 다른 주문 항목을
# 동시에 취소할 때 상대의 취소를 보지 못해 "모든 항목이 취소됐는데 주문은 RECEIVED·합계는 옛값"으로
# 남는 것이다. H2는 기본이 READ COMMITTED라 이 문제가 H2 배포에서는 드러나지 않는다.
# 앱 풀과 RDS 파라미터 그룹(transaction_isolation=READ-COMMITTED) 양쪽에 다 걸어 둔다.
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# --- 스키마: validate (자동 변경 금지) ---
# update로 두면 Hibernate가 COLLATE utf8mb4_bin을 모른 채 토큰 3개 컬럼(table_token·session_token·
# idempotency_key)을 대소문자 무시(ai_ci)로 만든다 → 틀린 토큰으로 인증이 통과한다(실측).
# 그래서 backend/docs/schema-mysql8.sql을 손으로 먼저 적용하고, 앱은 대조만 한다.
# validate는 테이블·컬럼 존재와 JDBC 타입만 본다 — 엔티티에 컬럼이 늘었는데 SQL을 빠뜨리면 기동이
# 실패해서 알려 준다. 이게 H2/update 구성에는 없는 방어막이다.
spring.jpa.hibernate.ddl-auto=validate

# H2 콘솔은 prod에서 이미 꺼져 있지만, MySQL에서는 H2 자동설정 자체가 필요 없다
spring.h2.console.enabled=false
