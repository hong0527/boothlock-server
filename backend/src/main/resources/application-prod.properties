# =====================================================================================
# 운영 프로필 (SPRING_PROFILES_ACTIVE=prod) — AWS EC2 1대(도커) + AWS RDS MySQL 8.0
#
# 이 파일은 기본 application.properties 위에 덧씌워진다. 여기 없는 키(업로드 상한, 유휴 임계, 캐시 초 등)는
# 기본 파일 값이 그대로 쓰인다. 비밀값은 절대 이 파일에 적지 않는다 — 전부 환경변수로 받는다.
#
# 반드시 넣어야 하는 환경변수 (없으면 기동이 실패한다 — 기본값을 두지 않아 "개발용 값으로 운영 기동"을 막는다):
#   SPRING_DATASOURCE_URL        jdbc:mysql://<RDS 엔드포인트>:3306/boothlock?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci
#                                 - characterEncoding은 Java 문자셋 이름 UTF-8 이어야 한다. 'utf8mb4'를 넣으면 Connector/J가
#                                   "Unsupported character encoding 'utf8mb4'"로 연결을 거부한다(로컬 MySQL 8.4 실측). 서버 측 utf8mb4는 드라이버가 고른다.
#                                 - serverTimezone=Asia/Seoul: DATETIME 컬럼은 타임존을 저장하지 않으므로 JVM(-Duser.timezone)·JDBC·RDS 파라미터(time_zone)를 모두 KST로 맞춘다 (DB스키마 원칙 8)
#   SPRING_DATASOURCE_USERNAME   RDS 앱 계정 (마스터 계정을 앱에 쓰지 않는다)
#   SPRING_DATASOURCE_PASSWORD
#   BOOTLOCK_JWT_SECRET          32바이트 이상 무작위 문자열 (예: openssl rand -base64 48). 바꾸면 발급된 운영자 토큰이 전부 무효화된다
#   BOOTLOCK_CUSTOMER_BASE_URL   손님 프론트 도메인 (예: https://boothlock.example.com) — QR에 인코딩되는 값. 인쇄 후에는 바꿀 수 없다
#   BOOTLOCK_CORS_ALLOWED_ORIGINS 프론트 배포 오리진, 쉼표 구분 (예: https://boothlock.example.com,https://www.boothlock.example.com). '*' 금지(기동 거부)
#
# 선택 환경변수:
#   BOOTLOCK_SEED_ENABLED        true 로 켠 기동 1회만 부스·ADMIN 계정·약도를 넣는다. 끝나면 false 로 되돌린다 (기본 false)
#   BOOTLOCK_SEED_FILE           시딩 JSON 경로 (컨테이너 안 경로, 예: /app/seed/event-seed.json). 형식: classpath seed/event-seed.example.json
#   BOOTLOCK_SEED_PASSWORD_*     시딩 파일의 passwordEnv 가 가리키는 부스 ADMIN 초기 비밀번호들
#   BOOTLOCK_OPERATIONS_WEBHOOK_URL  계좌 변경(O17) 알림 웹훅. 비우면 알림 없음 (BoothWebhookNotifier가 System.getenv로 직접 읽는다)
#   BOOTHLOCK_EVENT_SEATIDLEMINUTES  좌석 유휴 임계(분, 기본 180) — 기본 파일 참조. 철자가 BOOTHLOCK(H 포함)임에 주의
#   BOOTHLOCK_EVENT_BOOTHSCACHESECONDS  E1 캐시 초 (기본 10)
#   BOOTLOCK_UPLOAD_MENU_DIR / BOOTLOCK_UPLOAD_EVENT_DIR  업로드 폴더. 도커에서는 /app/data/uploads/{menu,event} 로 고정되며 볼륨으로 마운트한다
#   BOOTLOCK_SWAGGER_ENABLED     true 면 /swagger-ui 와 /v3/api-docs 를 연다 (기본 false — 운영자 API 목록을 익명에게 보이지 않게)
# =====================================================================================

# --- 데이터소스: RDS MySQL 8.0 ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 커넥션 풀(HikariCP). 고정 크기 10 = 최소 = 최대.
#   근거: ① 앱 서버 1대(EC2 2 vCPU)에 RDS 소형 인스턴스(db.t3/t4g.micro: max_connections 약 80~90, 2 vCPU)라
#   연결을 늘려도 DB 코어가 늘지 않는다 ② 파일럿 부하는 부스 수 × 손님 수십 명의 12초 폴링이며 E1은 10초 캐시로 DB를 거의 치지 않는다
#   ③ 채번·입금확인·퇴실은 행 잠금(SELECT ... FOR UPDATE)을 ms 단위로 잡고 놓아 연결 회전이 빠르다.
#   Hikari 권장식 (코어수×2 + 디스크수)도 2 vCPU DB에서 5 안팎이라 10은 여유분이다. 부족 신호는 로그의 "Connection is not available, request timed out".
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.pool-name=boothlock
# DB가 죽었을 때 요청을 30초(기본) 붙들지 않고 10초 안에 503류 오류로 떨어뜨린다
spring.datasource.hikari.connection-timeout=10000
# RDS wait_timeout(기본 8시간)보다 짧게 연결을 갈아 끼운다 — 기본 30분이면 충분하나 명시해 둔다
spring.datasource.hikari.max-lifetime=1800000

# 트랜잭션 격리수준: READ COMMITTED (필수 — 빼면 동시성 결함이 생긴다)
#   InnoDB 기본은 REPEATABLE READ로, 트랜잭션의 첫 일반 SELECT 시점 스냅샷을 끝까지 유지한다. 이 코드는 "인증용 SELECT →
#   SELECT ... FOR UPDATE 로 잠금 대기 → 풀린 뒤 관련 행을 다시 읽어 판정"하는 모양인데, RR에서는 그 재읽기가 옛 스냅샷을 본다.
#   로컬 MySQL 8.4 실측(2026-09-16, 전체 629건): RR에서는 동시성 5건이 실패 —
#     · 두 항목 동시 취소 시 상대 항목 취소를 못 봐 모든 항목이 취소됐는데 주문이 RECEIVED로 남음 (OrderEditConcurrencyTests)
#     · 취소 직후 입금확인이 409 사유를 INVALID_STATE 아닌 ALREADY_PAID로 잘못 응답 (×2)
#     · 퇴실이 커밋 직전 주문을 미결제 경고에서 빠뜨림 (TableCheckoutConcurrencyTests)
#     · 삭제 직전 스캔으로 생긴 세션을 못 보고 테이블을 비활성화 (TableSoftDeleteGuardTests)
#   READ COMMITTED(H2 기본값 — 지금까지의 모든 검증 조건)로 맞추면 5건 모두 통과했다. RDS 파라미터 그룹에도 같은 값을 둔다(이중 방어).
#   binlog_format 이 STATEMENT 이면 READ COMMITTED 가 거부되므로 ROW(8.0 기본) 또는 MIXED 여야 한다.
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# --- JPA/Hibernate ---
# validate: 운영 DB 스키마는 Hibernate가 바꾸지 않는다. 배포 전에 backend/docs/schema-mysql8.sql 을 직접 적용한다.
#   update를 쓰지 않는 이유: Hibernate는 table_token·session_token·idempotency_key 의 COLLATE utf8mb4_bin 과
#   orders.session_id 인덱스를 모른다. update로 만든 테이블은 토큰 컬럼이 대소문자 무시(ai_ci)가 되어 틀린 토큰으로 인증이 통과한다(실측).
#   validate는 컬럼 존재·JDBC 타입만 대조하므로 콜레이션·추가 인덱스는 통과하고, 엔티티에 컬럼이 추가된 채 SQL을 빠뜨리면 기동 시 즉시 실패해 알려 준다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- 개발 편의 기능 끄기 ---
spring.h2.console.enabled=false
springdoc.api-docs.enabled=${BOOTLOCK_SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${BOOTLOCK_SWAGGER_ENABLED:false}

# --- 필수 설정은 기본값 없이 — 환경변수가 빠지면 "Could not resolve placeholder"로 기동 실패 ---
boothlock.jwt.secret=${BOOTLOCK_JWT_SECRET}
boothlock.customer.base-url=${BOOTLOCK_CUSTOMER_BASE_URL}
boothlock.cors.allowed-origins=${BOOTLOCK_CORS_ALLOWED_ORIGINS}

# --- 서버 ---
server.port=8080
# 재배포 시 처리 중인 주문 요청을 끝내고 내려간다 (docker stop 의 기본 대기 10초 안에 끝나도록 8초)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=8s
# 리버스 프록시(nginx/Caddy/ALB) 뒤에서 X-Forwarded-* 를 신뢰해 스킴·호스트를 복원한다 (springdoc 서버 URL, 리다이렉트용)
server.forward-headers-strategy=framework

# --- 로그: 컨테이너 표준출력으로만 남긴다 (docker logs / CloudWatch agent가 수집) ---
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=INFO
