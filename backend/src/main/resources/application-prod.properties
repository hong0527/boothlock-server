# =====================================================================================
# 운영 프로필 (SPRING_PROFILES_ACTIVE=prod) — AWS EC2 1대(도커), DB는 별도 서버 없이 H2 파일
#
# 팀 결정(파일럿 규모 — 부스 3개·3일): RDS를 안 쓴다. 데이터가 통째로 날아가도 감수하기로 했고,
# 자동 백업·별도 DB 관리 비용보다 설정 단순함을 우선한다. RDS로 되돌리려면 이 파일의 데이터소스
# 섹션과 docker-compose.prod.yml, .env.prod.example을 backend/docs/배포_운영절차.md §1~§3 기준으로 되돌린다.
#
# 이 파일은 기본 application.properties 위에 덧씌워진다. 여기 없는 키(업로드 상한, 유휴 임계, 캐시 초 등)는
# 기본 파일 값이 그대로 쓰인다. 비밀값은 절대 이 파일에 적지 않는다 — 전부 환경변수로 받는다.
#
# 반드시 넣어야 하는 환경변수 (없으면 기동이 실패한다 — 기본값을 두지 않아 "개발용 값으로 운영 기동"을 막는다):
#   BOOTLOCK_JWT_SECRET          32바이트 이상 무작위 문자열 (예: openssl rand -base64 48). 바꾸면 발급된 운영자 토큰이 전부 무효화된다
#   BOOTLOCK_CUSTOMER_BASE_URL   손님 프론트 도메인 (예: https://boothlock.example.com) — QR에 인코딩되는 값. 인쇄 후에는 바꿀 수 없다
#   BOOTLOCK_CORS_ALLOWED_ORIGINS 프론트 배포 오리진, 쉼표 구분 (예: https://boothlock.example.com,https://www.boothlock.example.com). '*' 금지(기동 거부)
#
# 선택 환경변수:
#   BOOTLOCK_SEED_ENABLED        true 로 켠 기동 1회만 부스·ADMIN 계정·약도를 넣는다. 끝나면 false 로 되돌린다 (기본 false)
#   BOOTLOCK_SEED_FILE           시딩 JSON 경로 (컨테이너 안 경로, 예: /app/seed/event-seed.json). 형식: classpath seed/event-seed.example.json
#   BOOTLOCK_SEED_PASSWORD_*     시딩 파일의 passwordEnv 가 가리키는 부스 ADMIN 초기 비밀번호들
#   BOOTLOCK_OPERATIONS_WEBHOOK_URL  계좌 변경(O17) 알림 웹훅. 비우면 알림 없음 (BoothWebhookNotifier가 System.getenv로 직접 읽는다)
#   BOOTHLOCK_EVENT_SEATIDLEMINUTES  좌석 유휴 임계(분, 기본 180) — 기본 파일 참조. 철자가 BOOTHLOCK(H 포함)임에 주의
#   BOOTHLOCK_EVENT_BOOTHSCACHESECONDS  E1 캐시 초 (기본 10)
#   BOOTLOCK_UPLOAD_MENU_DIR / BOOTLOCK_UPLOAD_EVENT_DIR  업로드 폴더. 도커에서는 /app/data/uploads/{menu,event} 로 고정되며 볼륨으로 마운트한다
#   BOOTLOCK_SIGNUP_ENABLED      true 면 회원가입(O0, 임시 데모)을 연다 (기본 false — 신원 확인 없어 부스 사칭 위험, BoothSignupService 참고). 시연·심사 때만 켤 것
#   BOOTLOCK_SWAGGER_ENABLED     true 면 /swagger-ui 와 /v3/api-docs 를 연다 (기본 false — 운영자 API 목록을 익명에게 보이지 않게)
# =====================================================================================

# --- 데이터소스: H2 파일 DB ---
# /app/data/db 는 docker-compose.prod.yml이 호스트 볼륨으로 마운트한다 — 컨테이너를 내렸다 올려도(재배포) 그대로 남는다.
# EC2 자체가 죽으면 이 파일도 같이 사라진다(팀 결정 — 자동 백업 없음, 필요하면 tar로 수동 백업).
spring.datasource.url=jdbc:h2:file:/app/data/db/boothlock;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.datasource.hikari.pool-name=boothlock
spring.datasource.hikari.connection-timeout=10000

# 트랜잭션 격리수준: READ COMMITTED — H2 기본값과 같지만 의도를 코드로 명시해 둔다.
#   (MySQL/RDS로 옮기면 반드시 유지할 것 — InnoDB 기본 REPEATABLE READ에서는 "인증용 SELECT → SELECT ... FOR UPDATE
#   잠금 대기 → 재읽기" 패턴이 옛 스냅샷을 봐 동시성 결함 5건이 실제로 재현됐다. 배포 문서 §3-4 참조.)
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# --- JPA/Hibernate ---
# update: 별도 DBA 스키마 관리 없이 엔티티 변경을 그대로 반영한다(개발 프로필과 동일). H2는 기본이 대소문자
# 구분 콜레이션이라, MySQL/update 조합에서 실측된 "토큰 컬럼이 대소문자 무시가 되어 틀린 토큰으로 인증 통과"
# 문제가 여기서는 재현되지 않는다.
# 트레이드오프(팀 결정으로 감수): RDS/validate 조합이 주던 "스키마 어긋나면 기동 자체를 막는" 방어막이 없다.
# update는 컬럼이 조용히 추가·방치될 수 있어, 엔티티에서 컬럼을 지우거나 타입을 바꾸는 배포는 파일럿 기간엔 하지 않는다.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- 개발 편의 기능 끄기 ---
spring.h2.console.enabled=false
springdoc.api-docs.enabled=${BOOTLOCK_SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${BOOTLOCK_SWAGGER_ENABLED:false}

# --- 필수 설정은 기본값 없이 — 환경변수가 빠지면 "Could not resolve placeholder"로 기동 실패 ---
boothlock.jwt.secret=${BOOTLOCK_JWT_SECRET}
boothlock.customer.base-url=${BOOTLOCK_CUSTOMER_BASE_URL}
boothlock.cors.allowed-origins=${BOOTLOCK_CORS_ALLOWED_ORIGINS}

# --- 서버 ---
server.port=8080
# 재배포 시 처리 중인 주문 요청을 끝내고 내려간다 (docker stop 의 기본 대기 10초 안에 끝나도록 8초)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=8s
# 리버스 프록시(nginx/Caddy/ALB) 뒤에서 X-Forwarded-* 를 신뢰해 스킴·호스트를 복원한다 (springdoc 서버 URL, 리다이렉트용)
server.forward-headers-strategy=framework

# --- 로그: 컨테이너 표준출력으로만 남긴다 (docker logs / CloudWatch agent가 수집) ---
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=INFO
