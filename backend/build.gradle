plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.boothlock'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.security:spring-security-crypto'
	implementation 'org.springframework.security:spring-security-oauth2-jose'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.springframework.boot:spring-boot-h2console'
	// 운영 DB(AWS RDS MySQL 8.0)용 JDBC 드라이버 — prod 프로필(application-prod.properties)에서만 쓰인다.
	// 기본 프로필은 그대로 H2. 버전은 Spring Boot BOM이 관리한다.
	runtimeOnly 'com.mysql:mysql-connector-j'

	// O4·O4b QR 다운로드(전형준) — QR 이미지 생성 + PDF 조립
	implementation 'com.google.zxing:core:3.5.3'
	implementation 'com.google.zxing:javase:3.5.3'
	implementation 'com.github.librepdf:openpdf:1.3.42'

	// O19 정산 엑셀 — 열 너비·서식은 통합문서 안에만 저장할 수 있어서 CSV로는 지정할 방법이 없다
	implementation 'org.apache.poi:poi-ooxml:5.4.1'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

// 영업일(06:00 경계) 계산은 KST 전제 — 서버가 UTC여도 어긋나지 않게 고정 (docs/DB스키마 원칙 8)
tasks.withType(JavaExec).configureEach {
	jvmArgs '-Duser.timezone=Asia/Seoul'
}
tasks.withType(Test).configureEach {
	jvmArgs '-Duser.timezone=Asia/Seoul'
}
